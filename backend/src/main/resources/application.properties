server.port=${SERVER_PORT:5000}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/smartemailhr?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:CHANGE_ME_JWT_SECRET_MINIMUM_32_CHARACTERS_2026}
app.jwt.issuer=SmartEmailHR
app.jwt.audience=SmartEmailHR.Frontend
app.jwt.expiration-hours=8
app.n8n.shared-secret=${N8N_SHARED_SECRET:CHANGE_ME_N8N_SECRET}
app.n8n.acceptation-url=${N8N_ACCEPTATION_URL:http://localhost:5678/webhook/smartemailhr/acceptation}
app.n8n.refus-url=${N8N_REFUS_URL:http://localhost:5678/webhook/smartemailhr/refus}
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
app.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
