<main class="dashboard">
  <header class="top-bar">
    <div>
      <p class="kicker">SmartEmail HR</p>
      <h1>Tableau de Bord RH</h1>
    </div>

    <div class="actions">
      <a routerLink="/rh/offres/new" class="primary-btn">Créer une offre</a>
      <button type="button" (click)="logout()">Déconnexion</button>
    </div>
  </header>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <section class="stats-grid">
    <app-stat-card label="Candidatures totales" [value]="totalCandidates.toString()" accent="blue"></app-stat-card>
    <app-stat-card label="Acceptées" [value]="acceptedCount.toString()" accent="green"></app-stat-card>
    <app-stat-card label="Refusées" [value]="refusedCount.toString()" accent="red"></app-stat-card>
    <app-stat-card label="En attente" [value]="pendingCount.toString()" accent="orange"></app-stat-card>
  </section>

  <section class="filters">
    <label>
      Domaine
      <select [(ngModel)]="selectedDomain">
        <option *ngFor="let d of domains" [value]="d">{{ d }}</option>
      </select>
    </label>

    <label>
      Statut
      <select [(ngModel)]="selectedStatut">
        <option value="Tous">Tous</option>
        <option value="EnAttente">En attente</option>
        <option value="Accepte">Accepté</option>
        <option value="Refuse">Refusé</option>
      </select>
    </label>

    <label>
      Recherche
      <input [(ngModel)]="searchTerm" placeholder="Nom, email, compétence..." />
    </label>
  </section>

  <section>
    <div class="section-title">
      <h2>Offres d'emploi</h2>
      <button type="button" *ngIf="selectedOffreId" class="text-btn" (click)="clearOfferFilter()">Voir toutes les offres</button>
    </div>

    <div class="offres-grid" *ngIf="!loading; else loadingTpl">
      <app-offre-card
        *ngFor="let offre of filteredOffres"
        [offre]="offre"
        (open)="openOffer($event)"
        (edit)="editOffer($event)">
      </app-offre-card>
    </div>
  </section>

  <section>
    <h2>Candidatures</h2>
    <div class="candidature-list" *ngIf="!loading; else loadingTpl">
      <app-candidat-card
        *ngFor="let candidature of filteredCandidatures"
        [candidature]="candidature"
        (open)="openCandidate($event)">
      </app-candidat-card>
      <p *ngIf="filteredCandidatures.length === 0" class="muted">Aucune candidature correspondant aux filtres.</p>
    </div>
  </section>
</main>

<ng-template #loadingTpl>
  <p class="muted">Chargement des données...</p>
</ng-template>
